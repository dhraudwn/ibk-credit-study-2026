name: Deploy study app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack study app
        run: |
          cat study-site.tar.gz.part* > "$RUNNER_TEMP/study-site.tar.gz"
          echo "a3c9d32882c56d5dfded3e65f77152557651b1d73e6451b1e7fe7fe8426a7ff8  $RUNNER_TEMP/study-site.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/study-site.tar.gz"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test work/core.test.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
